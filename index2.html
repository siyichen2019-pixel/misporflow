<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MisporFlow</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MisporFlow">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
  body {
    font: 15px/1.6 -apple-system, system-ui, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
  }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  button { font: inherit; padding: 6px 14px; cursor: pointer; }
  button.small { font-size: 13px; padding: 3px 10px; }
  #status { font-size: 13px; color: #888; }
  #status.live { color: #c0392b; }
  .field { margin-bottom: 20px; }
  .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .head label { font-size: 13px; color: #666; }
  .head .actions { display: flex; align-items: center; gap: 8px; }
  .hint { font-size: 12px; color: #2e7d32; visibility: hidden; }
  textarea {
    width: 100%; box-sizing: border-box;
    font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace;
    padding: 8px 10px;
    border: 1px solid #ccc; border-radius: 6px;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #888; }
  #code {
    width: 100%; box-sizing: border-box;
    font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace;
    padding: 8px 10px;
    border: 1px solid #ccc; border-radius: 6px;
  }
  #code:focus { outline: none; border-color: #888; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
  textarea.busy::placeholder { animation: pulse 1.4s ease-in-out infinite; }
  .dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: #c0392b;
    margin-right: 6px; vertical-align: middle;
    animation: pulse 1.2s ease-in-out infinite;
  }
</style>

<div class="bar">
  <button id="btn">Record</button>
  <span id="status">Hold Option to record</span>
</div>

<div class="field">
  <div class="head">
    <label for="code">Access code</label>
    <div class="actions">
      <button class="small" id="peek" type="button" aria-label="Show code">Show</button>
    </div>
  </div>
  <input id="code" type="password" placeholder="paste the code you were given">
</div>

<div class="field">
  <div class="head">
    <label for="raw">Transcript</label>
    <div class="actions">
      <button class="small" data-copy="raw">Copy</button>
    </div>
  </div>
  <textarea id="raw" rows="3"></textarea>
</div>

<div class="field">
  <div class="head">
    <label for="out">Polished</label>
    <div class="actions">
      <span class="hint" id="hint">Copied</span>
      <button class="small" id="repolish">Re-polish</button>
      <button class="small" data-copy="out">Copy</button>
    </div>
  </div>
  <textarea id="out" rows="3"></textarea>
</div>

<script>
let mr, chunks = [], recording = false, mime = "audio/webm";

// 共享暗号：服务器认这个才干活。存浏览器里，填一次就行。
code.value = localStorage.getItem("code") || "";
code.onchange = code.onblur = () => localStorage.setItem("code", code.value.trim());
const auth = () => ({"X-Access-Code": code.value.trim()});

peek.onclick = () => {
  const hidden = code.type === "password";
  code.type = hidden ? "text" : "password";
  peek.textContent = hidden ? "Hide" : "Show";
  peek.setAttribute("aria-label", hidden ? "Hide code" : "Show code");
};

// 静音检测：Whisper 拿到静音会瞎编（"谢谢观看"之类），所以静音根本不发出去。
const LOUD = 0.02, LOUD_FRAMES = 3, MIN_MS = 400;
let audioCtx = null, meterTimer = null, loudFrames = 0, startedAt = 0;

function startMeter(stream) {
  loudFrames = 0;
  startedAt = Date.now();
  audioCtx = new AudioContext();
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  const buf = new Float32Array(analyser.fftSize);
  meterTimer = setInterval(() => {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    if (Math.sqrt(sum / buf.length) > LOUD) loudFrames++;
  }, 100);
}

function stopMeter() {
  clearInterval(meterTimer);
  meterTimer = null;
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  return loudFrames >= LOUD_FRAMES && Date.now() - startedAt >= MIN_MS;
}

function pickMime() {
  const candidates = ["audio/webm", "audio/mp4", "audio/aac"];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
  }
  return "";
}

function extFor(m) {
  if (m.includes("webm")) return "webm";
  if (m.includes("mp4") || m.includes("aac")) return "mp4";
  return "webm";
}

function setStatus(text, live) {
  status.innerHTML = live ? '<span class="dot"></span>' + text : text;
  status.className = live ? "live" : "";
}

function busy(el, text) {
  el.value = "";
  el.placeholder = text;
  el.classList.add("busy");
}

function done(el, text) {
  el.classList.remove("busy");
  el.placeholder = "";
  el.value = text;
}

function fail(el, message) {
  el.classList.remove("busy");
  el.value = "";
  el.placeholder = message;
}

async function flow(text) {
  busy(out, "Polishing…");
  try {
    const r = await fetch("/make_it_flow", {
      method: "POST",
      headers: {"Content-Type": "application/json", ...auth()},
      body: JSON.stringify({text})
    });
    if (r.status === 401) throw new Error("code");
    if (!r.ok) throw new Error(r.status);
    done(out, (await r.json()).flowed);
  } catch (e) {
    fail(out, e.message === "code"
      ? "Access code missing or wrong."
      : "Couldn't polish that. Hit Re-polish to try again.");
  }
}

btn.onclick = async () => {
  if (!recording) {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio: true});
    } catch (e) {
      setStatus("Microphone blocked. Check your browser permissions.");
      return;
    }
    mime = pickMime();
    try {
      mr = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
    } catch (e) {
      stream.getTracks().forEach(t => t.stop());
      setStatus("Recording not supported in this browser.");
      return;
    }
    if (!mime) mime = mr.mimeType || "audio/webm";
    chunks = [];
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      const heard = stopMeter();
      stream.getTracks().forEach(t => t.stop());
      if (!heard) {
        setStatus("Didn't hear anything. Try again.");
        return;
      }
      busy(raw, "Transcribing…");
      out.value = "";
      out.placeholder = "";
      const fd = new FormData();
      fd.append("file", new Blob(chunks, {type: mime}), "a." + extFor(mime));
      try {
        const r = await fetch("/transcribe", {method: "POST", headers: auth(), body: fd});
        if (r.status === 401) throw new Error("code");
        if (!r.ok) throw new Error(r.status);
        const t = await r.json();
        done(raw, t.text);
        await flow(t.text);
      } catch (e) {
        fail(raw, e.message === "code"
          ? "Access code missing or wrong."
          : "Couldn't transcribe that. Record again.");
      }
    };
    mr.start();
    startMeter(stream);
    btn.textContent = "Stop";
    setStatus("Recording…", true);
  } else {
    mr.stop();
    btn.textContent = "Record";
    setStatus("Hold Option to record");
  }
  recording = !recording;
};

repolish.onclick = () => {
  if (raw.value.trim()) flow(raw.value);
};

document.querySelectorAll("[data-copy]").forEach(b => {
  b.onclick = async () => {
    await navigator.clipboard.writeText(document.getElementById(b.dataset.copy).value);
    hint.style.visibility = "visible";
    setTimeout(() => hint.style.visibility = "hidden", 1200);
  };
});

document.addEventListener("keydown", e => {
  if (e.key === "Alt" && !recording && document.activeElement.tagName !== "TEXTAREA") btn.click();
});
document.addEventListener("keyup", e => {
  if (e.key === "Alt" && recording) btn.click();
});
window.addEventListener("blur", () => {
  if (recording) btn.click();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}
</script>
