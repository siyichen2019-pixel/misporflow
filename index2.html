<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whisperflow</title>
<style>
  body {
    font: 15px/1.6 -apple-system, system-ui, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1a1a1a;
  }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  button { font: inherit; padding: 6px 14px; cursor: pointer; }
  button.small { font-size: 13px; padding: 3px 10px; }
  #status { font-size: 13px; color: #888; }
  #status.live { color: #c0392b; }
  .field { margin-bottom: 20px; }
  .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .head label { font-size: 13px; color: #666; }
  .head .actions { display: flex; align-items: center; gap: 8px; }
  .hint { font-size: 12px; color: #2e7d32; visibility: hidden; }
  textarea {
    width: 100%; box-sizing: border-box;
    font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace;
    padding: 8px 10px;
    border: 1px solid #ccc; border-radius: 6px;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #888; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
  textarea.busy::placeholder { animation: pulse 1.4s ease-in-out infinite; }
  .dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: #c0392b;
    margin-right: 6px; vertical-align: middle;
    animation: pulse 1.2s ease-in-out infinite;
  }
</style>

<div class="bar">
  <button id="btn">Record</button>
  <span id="status">Hold Option to record</span>
</div>

<div class="field">
  <div class="head">
    <label for="raw">Transcript</label>
    <div class="actions">
      <button class="small" data-copy="raw">Copy</button>
    </div>
  </div>
  <textarea id="raw" rows="3"></textarea>
</div>

<div class="field">
  <div class="head">
    <label for="out">Polished</label>
    <div class="actions">
      <span class="hint" id="hint">Copied</span>
      <button class="small" id="repolish">Re-polish</button>
      <button class="small" data-copy="out">Copy</button>
    </div>
  </div>
  <textarea id="out" rows="3"></textarea>
</div>

<script>
let mr, chunks = [], recording = false;

function setStatus(text, live) {
  status.innerHTML = live ? '<span class="dot"></span>' + text : text;
  status.className = live ? "live" : "";
}

function busy(el, text) {
  el.value = "";
  el.placeholder = text;
  el.classList.add("busy");
}

function done(el, text) {
  el.classList.remove("busy");
  el.placeholder = "";
  el.value = text;
}

function fail(el, message) {
  el.classList.remove("busy");
  el.value = "";
  el.placeholder = message;
}

async function flow(text) {
  busy(out, "Polishing…");
  try {
    const r = await fetch("/make_it_flow", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text})
    });
    if (!r.ok) throw new Error(r.status);
    done(out, (await r.json()).flowed);
  } catch (e) {
    fail(out, "Couldn't polish that. Hit Re-polish to try again.");
  }
}

btn.onclick = async () => {
  if (!recording) {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio: true});
    } catch (e) {
      setStatus("Microphone blocked. Check your browser permissions.");
      return;
    }
    mr = new MediaRecorder(stream);
    chunks = [];
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      busy(raw, "Transcribing…");
      out.value = "";
      out.placeholder = "";
      const fd = new FormData();
      fd.append("file", new Blob(chunks, {type: "audio/webm"}), "a.webm");
      try {
        const r = await fetch("/transcribe", {method: "POST", body: fd});
        if (!r.ok) throw new Error(r.status);
        const t = await r.json();
        done(raw, t.text);
        await flow(t.text);
      } catch (e) {
        fail(raw, "Couldn't transcribe that. Record again.");
      }
    };
    mr.start();
    btn.textContent = "Stop";
    setStatus("Recording…", true);
  } else {
    mr.stop();
    btn.textContent = "Record";
    setStatus("Hold Option to record");
  }
  recording = !recording;
};

repolish.onclick = () => {
  if (raw.value.trim()) flow(raw.value);
};

document.querySelectorAll("[data-copy]").forEach(b => {
  b.onclick = async () => {
    await navigator.clipboard.writeText(document.getElementById(b.dataset.copy).value);
    hint.style.visibility = "visible";
    setTimeout(() => hint.style.visibility = "hidden", 1200);
  };
});

document.addEventListener("keydown", e => {
  if (e.key === "Alt" && !recording && document.activeElement.tagName !== "TEXTAREA") btn.click();
});
document.addEventListener("keyup", e => {
  if (e.key === "Alt" && recording) btn.click();
});
window.addEventListener("blur", () => {
  if (recording) btn.click();
});
</script>
